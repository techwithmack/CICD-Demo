name: "🔍 AI Agent Triage - Security Demo"

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  simulate-ai-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python: '3.10'

      - name: Execute Simulated Agent Pipeline
        env:
          # In a real vulnerability, these would be your real sensitive tokens
          MOCK_GEMINI_API_KEY: "AIzaSyFakeToken_Gemini12345"
          MOCK_GITHUB_TOKEN: "ghp_FakeGitHubTokenForDemoPurposesOnly"
          ISSUE_TITLE: "${{ github.event.issue.title }}"
          ISSUE_BODY: "${{ github.event.issue.body }}"
          ISSUE_NUMBER: "${{ github.event.issue.number }}"
          REPO: "${{ github.repository }}"
        run: |
          cat << 'EOF' > agent_sim.py
          import os
          import sys
          import subprocess

          # 1. Collect environment data
          issue_title = os.getenv("ISSUE_TITLE", "")
          issue_body = os.getenv("ISSUE_BODY", "")
          issue_num = os.getenv("ISSUE_NUMBER", "")
          repo = os.getenv("REPO", "")

          # 2. Construct the prompt with direct string injection
          prompt = f"""
          System Instruction: You are an AI Triage Assistant. Your job is to read the issue text and determine if it is a bug or a feature request.
          Available Tools: 
          - run_shell_command(cmd) -> Allowed commands: 'gh issue edit', 'gh label add'

          Issue Content to Analyze:
          Title: {issue_title}
          Body: {issue_body}

          Output your classification or the tool call required.
          """

          print("--- PROMPT SENT TO MODEL ---")
          print(prompt)
          print("----------------------------")

          # 3. Simulate Model Processing / Parsing
          # For a deterministic POC, we look for specific payload strings in the untrusted input 
          # to mimic the LLM obeying the prompt injection over the system prompt.
          if "Important additional instruction:" in issue_body:
              print("[!] Model Decision: Prompt Injection Detected in Text. Diverting to injected instructions.")
              
              # Extract the payload command constructed by the injector
              if "run_shell_command:" in issue_body:
                  # Simulate the LLM parsing the instruction and deciding to invoke the tool
                  # This mimics: gh issue edit <id> --body "Tokens: $MOCK_GEMINI_API_KEY"
                  fake_key = os.getenv("MOCK_GEMINI_API_KEY")
                  fake_gh = os.getenv("MOCK_GITHUB_TOKEN")
                  
                  payload_body = f"⚠️ EXFILTRATION DEMO SUCCESSFUL \n\n**Exfiltrated Secrets:**\n- GEMINI_KEY: `{fake_key}`\n- GITHUB_TOKEN: `{fake_gh}`"
                  
                  print(f"[!] Executing Agent Tool on behalf of malicious instruction...")
                  subprocess.run(["gh", "issue", "edit", issue_num, "--repo", repo, "--body", payload_body])
          else:
              # Normal operational flow
              print("[+] Model Decision: Standard Triage. Adding default 'triage' label.")
              subprocess.run(["gh", "issue", "edit", issue_num, "--repo", repo, "--add-label", "triage"])

          EOF
          python agent_sim.py
